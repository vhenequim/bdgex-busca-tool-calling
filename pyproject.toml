[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pfc-busca"
version = "0.1.0"
description = "PFC IME — camada de tradução linguística (NL → parâmetros de busca) com Tool Calling sobre o acervo da DSG"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
  { name = "Vinicius Henequim Corrêa" },
  { name = "Daniel Santana" },
]
dependencies = [
  "langchain-core>=1.6,<2",
  "langchain-ollama>=1.1,<2",
  "langchain-openai>=1.0,<2",
  "ollama>=0.6,<1",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.9",
  "psycopg[binary]>=3.2",
  "python-dotenv>=1.0",
  "rich>=13.7",
  "pandas>=2.2",
  "matplotlib>=3.9",
]

[project.urls]
Repository = "https://github.com/vhenequim/bdgex-busca-tool-calling"
Prototipo = "https://github.com/1cgeo/prototipo_busca_llm"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
pfc-avaliar = "pfc_busca.evaluation.run_evaluation:main"
pfc-dataset = "pfc_busca.evaluation.dataset_builder:main"
pfc-relatorio = "pfc_busca.evaluation.report:main"
pfc-auditar = "pfc_busca.evaluation.audit:main"
pfc-conferir = "pfc_busca.evaluation.conferencia:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
